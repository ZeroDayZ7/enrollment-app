<!-- Navbar Material 3 z układem Tailwind -->
<mat-toolbar class="flex justify-between items-center px-6 shadow-sm border-b border-stone-200 dark:border-stone-800">
  <div class="flex items-center gap-3">
    <mat-icon class="text-indigo-500">school</mat-icon>
    <span class="font-semibold text-lg tracking-tight">Enrollment App</span>
  </div>

  <button mat-icon-button (click)="themeService.toggleTheme()" aria-label="Przełącz motyw">
    <mat-icon>{{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>

<!-- Kontener główny -->
<main class="container mx-auto p-6 max-w-5xl">
  <mat-card class="p-4 mb-6">
    <mat-card-header>
      <mat-card-title class="text-2xl font-bold mb-1">Aplikacja rekrutacyjna gotowa!</mat-card-title>
      <mat-card-subtitle>Angular Material 3 + Tailwind CSS v4</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content class="mt-4">
      <p class="mb-4 text-stone-600 dark:text-stone-300">
        Przetestuj działanie ikony w prawym górnym rogu – płynnie przełącza motyw jasny/ciemny oraz style Tailwinda.
      </p>
      <div class="flex gap-3">
        <button mat-flat-button>Przycisk Główny</button>
        <button mat-stroked-button>Przycisk Pomocniczy</button>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Miejsce na widoki z Routera -->
  <router-outlet></router-outlet>
</main>
