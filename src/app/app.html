<div
  class="min-h-screen bg-slate-950 text-slate-100 flex flex-col relative overflow-x-hidden font-sans selection:bg-blue-500 selection:text-white">

  <!-- Dekoracyjne poświaty tła (widoczne w całej aplikacji) -->
  <div class="fixed -top-40 -left-40 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed -bottom-40 -right-40 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Spójny, Nowoczesny Topbar -->
  <mat-toolbar
    class="!bg-slate-900/80 !border-b !border-slate-800/80 backdrop-blur-md sticky top-0 z-50 !h-16 !px-6 flex justify-between items-center text-slate-100">

    <!-- Logo & Nazwa Systemu -->
    <div class="flex items-center gap-3 cursor-pointer" routerLink="/official/dashboard">
      <div
        class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 shadow-inner">
        <mat-icon class="!w-5 !h-5 !text-[20px] flex items-center justify-center">admin_panel_settings</mat-icon>
      </div>
      <div class="flex flex-col">
        <span class="font-bold text-sm tracking-tight text-slate-100 leading-tight">System Administracyjny</span>
        <span class="text-[11px] text-slate-400 font-medium">Niezależny Rejestr Obywateli</span>
      </div>
    </div>

    <!-- Prawy Panel (Akcje & Motyw) -->
    <div class="flex items-center gap-3">
      <span
        class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-800/60 border border-slate-700/50 text-[11px] text-slate-400">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        Węzeł Produkcyjny
      </span>

      <button mat-icon-button (click)="themeService.toggleTheme()" aria-label="Przełącz motyw"
        class="!text-slate-400 hover:!text-slate-100 transition">
        <mat-icon>{{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </div>
  </mat-toolbar>

  <!-- Główny kontener na podstrony (Router Outlet) -->
  <main class="flex-1 flex flex-col justify-center items-center p-4 md:p-8 w-full max-w-7xl mx-auto z-10">
    <router-outlet />
  </main>

  <!-- Dyskretna stopka globalna -->
  <footer class="py-3 text-center text-[11px] text-slate-600 border-t border-slate-900/80">
    Rejestr Obywateli &copy; System Klasy Enterprise • Bezpieczeństwo Zero-Trust
  </footer>

</div>
