<div class="space-y-6">
  <div
    class="bg-gradient-to-r from-stone-800 to-stone-900 rounded-2xl p-6 text-white shadow-lg flex justify-between items-center border border-stone-700">
    <div>
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <mat-icon class="text-indigo-400">verified_user</mat-icon> Panel Administracyjny Urzędu
      </h1>
      <p class="text-stone-400 text-sm mt-1">Zarządzanie sprawami obywateli i weryfikacja dokumentów.</p>
    </div>
    <button mat-stroked-button routerLink="/official/login"
      class="!border-stone-600 !text-stone-200 hover:!bg-stone-800">
      <mat-icon>logout</mat-icon> Wyloguj
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <mat-card class="p-5 border border-stone-200 dark:border-stone-800 rounded-2xl bg-white dark:bg-stone-900">
      <span class="text-stone-400 text-xs font-semibold uppercase tracking-wider">Oczekujące wnioski</span>
      <h2 class="text-3xl font-extrabold text-stone-800 dark:text-stone-100 mt-2">142</h2>
      <p class="text-xs text-amber-600 mt-1 flex items-center gap-1">
        <mat-icon class="!text-base">schedule</mat-icon> Wymagają weryfikacji
      </p>
    </mat-card>

    <mat-card class="p-5 border border-stone-200 dark:border-stone-800 rounded-2xl bg-white dark:bg-stone-900">
      <span class="text-stone-400 text-xs font-semibold uppercase tracking-wider">Rozpatrzone dziś</span>
      <h2 class="text-3xl font-extrabold text-stone-800 dark:text-stone-100 mt-2">28</h2>
      <p class="text-xs text-emerald-600 mt-1 flex items-center gap-1">
        <mat-icon class="!text-base">check_circle</mat-icon> Zatwierdzone pomyślnie
      </p>
    </mat-card>

    <mat-card class="p-5 border border-stone-200 dark:border-stone-800 rounded-2xl bg-white dark:bg-stone-900">
      <span class="text-stone-400 text-xs font-semibold uppercase tracking-wider">Błędy / Odrzucone</span>
      <h2 class="text-3xl font-extrabold text-stone-800 dark:text-stone-100 mt-2">3</h2>
      <p class="text-xs text-rose-600 mt-1 flex items-center gap-1">
        <mat-icon class="!text-base">error</mat-icon> Do wyjaśnienia
      </p>
    </mat-card>
  </div>

  <mat-card class="p-6 border border-stone-200 dark:border-stone-800 rounded-2xl bg-white dark:bg-stone-900">
    <h3 class="text-lg font-bold text-stone-800 dark:text-stone-100 mb-4">Szybkie operacje</h3>
    <div class="flex flex-wrap gap-4">
      <button mat-flat-button class="!bg-indigo-600 !text-white">Pobierz kolejkę wniosków</button>
      <button mat-stroked-button>Generuj raport dzienny</button>
      <button mat-stroked-button>Przejdź do rejestru obywateli</button>
    </div>
  </mat-card>
</div>
