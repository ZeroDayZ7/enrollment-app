<div class="login-container">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-card">
    <h2>Panel Pracownika</h2>

    @if (errorMessage()) {
    <div class="alert alert-error">
      {{ errorMessage() }}
    </div>
    }

    <div class="form-group">
      <label for="username">Identyfikator / Login</label>
      <input id="username" type="text" formControlName="username" placeholder="np. jan.kowalski" />
      @if (loginForm.controls.username.touched && loginForm.controls.username.errors?.['required']) {
      <small class="error-text">Login jest wymagany</small>
      }
    </div>

    <div class="form-group">
      <label for="pin">Kod PIN</label>
      <input id="pin" type="password" formControlName="pin" maxlength="8" placeholder="****" />
      @if (loginForm.controls.pin.touched && loginForm.controls.pin.errors?.['required']) {
      <small class="error-text">PIN jest wymagany</small>
      }
    </div>

    <button type="submit" [disabled]="isLoading()">
      @if (isLoading()) {
      Logowanie...
      } @else {
      Zaloguj się
      }
    </button>
  </form>
</div>
